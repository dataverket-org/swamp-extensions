# Four ServiceAccounts that may do less than an administrator:
#   reader   reads every cert-manager kind, changes nothing
#   noissuer reads everything but Issuers and ClusterIssuers
#   narrow   reads Certificates only
#   editor   may patch Certificates, but not their status subresource
apiVersion: v1
kind: ServiceAccount
metadata: { name: reader, namespace: pki }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: narrow, namespace: pki }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: editor, namespace: pki }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: smoke-cert-reader }
rules:
  - apiGroups: [cert-manager.io]
    resources: [certificates, certificaterequests, issuers, clusterissuers]
    verbs: [get, list]
  - apiGroups: [acme.cert-manager.io]
    resources: [orders, challenges]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: smoke-cert-narrow }
rules:
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: smoke-cert-editor }
rules:
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, list, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: smoke-cert-reader }
roleRef: {
  apiGroup: rbac.authorization.k8s.io,
  kind: ClusterRole,
  name: smoke-cert-reader,
}
subjects: [{ kind: ServiceAccount, name: reader, namespace: pki }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: smoke-cert-narrow }
roleRef: {
  apiGroup: rbac.authorization.k8s.io,
  kind: ClusterRole,
  name: smoke-cert-narrow,
}
subjects: [{ kind: ServiceAccount, name: narrow, namespace: pki }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: smoke-cert-editor }
roleRef: {
  apiGroup: rbac.authorization.k8s.io,
  kind: ClusterRole,
  name: smoke-cert-editor,
}
subjects: [{ kind: ServiceAccount, name: editor, namespace: pki }]
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: noissuer, namespace: pki }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: smoke-cert-noissuer }
rules:
  - apiGroups: [cert-manager.io]
    resources: [certificates, certificaterequests]
    verbs: [get, list]
  - apiGroups: [acme.cert-manager.io]
    resources: [orders, challenges]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: smoke-cert-noissuer }
roleRef: {
  apiGroup: rbac.authorization.k8s.io,
  kind: ClusterRole,
  name: smoke-cert-noissuer,
}
subjects: [{ kind: ServiceAccount, name: noissuer, namespace: pki }]
