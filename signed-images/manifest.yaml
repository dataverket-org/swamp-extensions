manifestVersion: 1
name: "@dataverket/signed-images"
version: "2026.10.29.1"
description: >
  Eight workflows composing @dataverket/ko, @dataverket/cosign,
  @dataverket/flux and @dataverket/crane. `@dataverket/ko-signed-images`: a signed build, every
  command of one Go module built into an image by ko and pushed, every image
  signed by digest with cosign using a key held in a vault, every signature
  verified. `@dataverket/ko-signed-manifests`: signed manifests, ko resolve
  renders them with every ko:// image built, pushed and pinned by digest, each
  image is signed, the rendered manifests are attested onto it as a custom
  predicate, and both are verified. `@dataverket/verified-manifests`: every
  image a rendered manifest file names verified against a public key,
  read-only, a gate before a deploy. `@dataverket/signed-release`: a directory
  of rendered manifests pushed as one OCI artifact with flux push artifact,
  tagged with the commit, with a release.json listing every image by digest
  from this run's resolution record, the artifact signed by digest, the
  rendered manifests attested onto it, both verified. `@dataverket/verify-release`:
  the gate, read-only, the artifact's tag pinned to its digest with crane, its
  signature and custom attestation verified against a public key, release.json
  read out of its layer, every image it lists verified by digest.
  `@dataverket/pinned-base-image`: an upstream base image resolved to its
  digest with crane, held in quarantine until that digest has been the tag's
  for minimumAgeDays, verified keyless against the publisher's identity,
  copied into our registry by digest, signed with our key and verified, the
  mirror record then feeding ko-signed-images through baseImageFrom.
  `@dataverket/promote-release`: verify-release as a nested workflow, then the
  channel tag such as current pointed at the verified digest with crane tag
  and read back, the digest it held before recorded for a rollback.
  `@dataverket/mirror-release-images`: verify-release, then every image the
  release lists copied by digest into another registry with its sha256-<hex>
  signature tag, and verified there. Each run fails unless all of it happened
  for all of the images.

  cosign signs the digests this run's records carry, the image records of a
  build, the images a resolution built, or the artifact flux pushed, never a
  value from an input, so what is signed is exactly what was built or pushed.
  The key and its passphrase are named by vault and key, because workflow
  inputs are recorded in cleartext in the run history. With `tlog` false, the
  default, signatures go to the registry only; with `tlog` true they are
  recorded in Rekor. Registry credentials come from the container config of
  the user running swamp, except where crane writes, a promotion or a mirror,
  where they are named by vault and key. Built on `@dataverket/ko`,
  `@dataverket/cosign`, `@dataverket/flux` and `@dataverket/crane`, all four
  dependencies.
repository: "https://github.com/dataverket-org/swamp-extensions"
