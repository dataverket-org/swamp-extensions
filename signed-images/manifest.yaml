manifestVersion: 1
name: "@dataverket/signed-images"
version: "2026.10.29.1"
description: >
  Four workflows composing @dataverket/ko, @dataverket/cosign and
  @dataverket/flux. `@dataverket/ko-signed-images`: a signed build, every
  command of one Go module built into an image by ko and pushed, every image
  signed by digest with cosign using a key held in a vault, every signature
  verified. `@dataverket/ko-signed-manifests`: signed manifests, ko resolve
  renders them with every ko:// image built, pushed and pinned by digest, each
  image is signed, the rendered manifests are attested onto it as a custom
  predicate, and both are verified. `@dataverket/verified-manifests`: every
  image a rendered manifest file names verified against a public key,
  read-only, a gate before a deploy. `@dataverket/signed-release`: a directory
  of rendered manifests pushed as one OCI artifact with flux push artifact,
  tagged with the commit, with a release.json listing every image by digest
  from this run's resolution record, the artifact signed by digest, the
  rendered manifests attested onto it, both verified. Each run fails unless
  all of it happened for all of the images.

  cosign signs the digests this run's records carry, the image records of a
  build, the images a resolution built, or the artifact flux pushed, never a
  value from an input, so what is signed is exactly what was built or pushed.
  The key and its passphrase are named by vault and key, because workflow
  inputs are recorded in cleartext in the run history. With `tlog` false, the
  default, signatures go to the registry only; with `tlog` true they are
  recorded in Rekor. Registry credentials come from the container config of
  the user running swamp. Built on `@dataverket/ko`, `@dataverket/cosign` and
  `@dataverket/flux`, all three dependencies.
repository: "https://github.com/dataverket-org/swamp-extensions"
