services:
  db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zitadel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  zitadel:
    image: ghcr.io/zitadel/zitadel:${ZITADEL_VERSION:-v4.19.3}
    command: >-
      start-from-init --masterkey MasterkeyNeedsToHave32Characters --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8899
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: swamp-admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: swamp admin
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINEKEY_TYPE: "1"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINEKEY_EXPIRATIONDATE: "2027-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_MACHINEKEYPATH: /machinekey/swamp-admin.json
    volumes:
      - ./machinekey:/machinekey:z
    ports:
      - "127.0.0.1:8899:8080"
    depends_on:
      db:
        condition: service_healthy
