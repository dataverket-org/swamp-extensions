manifestVersion: 1
name: "@dataverket/zitadel"
version: "2026.11.08.1"
description: >
  Zitadel for swamp, over its API: nine model types, one per resource, with
  the whole life cycle of each.

  `@dataverket/zitadel/project` lists, reads, creates, renames, deactivates and
  deletes projects, and defines their roles. `@dataverket/zitadel/app` covers a
  project's applications: OIDC clients and API resource servers, their
  configuration, a careful redirect-allowlist change that cannot clobber the
  rest of a shared client, client-secret rotation, application keys, and
  deactivate or delete. `@dataverket/zitadel/user` is human and machine users
  over the v2 user service: find-or-create, update, deactivate, lock, delete,
  personal access tokens, keys, client secrets, metadata, a password reset
  that mints a link rather than taking a password, and a passkey registration
  link that lets a person register a passkey on the host the link names
  without logging in first.
  `@dataverket/zitadel/grant` is the roles a user holds on a project, and
  `@dataverket/zitadel/org` reads the organizations and their managers.
  `@dataverket/zitadel/action` covers v2 actions: the targets an instance calls
  out to, their signing and public keys, and the executions that bind a
  condition — a request, a response, an event or a named function — to the
  targets it calls, with a catalog method that says which conditions this
  instance will accept. `@dataverket/zitadel/settings` reads the login,
  lockout, password, branding, domain, legal and security settings in force for
  an organization or the instance, each saying whether it is the
  organization's own or inherited, with the instance's token lifetimes, secret
  generators, email providers and notification settings beside them, writes
  the two that v2 exposes, and sets how long a one-time code such as a passkey
  registration code stays valid. `@dataverket/zitadel/system` is the instances
  a deployment hosts, kept with a System API user: each instance's domain list
  — list, add, remove verify-first, set the primary — and the instances
  themselves, listed and created with a first organization and a machine owner
  whose token or key is emitted once. `@dataverket/zitadel/instance` is the
  same instance read with an ordinary key: its domains, the domains it trusts,
  and every holder of an instance role; trusted domains are added and removed
  verify-first.

  Projects also carry their grants to other organizations, and the members who
  administer them; users carry their authentication factors and
  identity-provider links, and one run can audit every human's factors with a
  summary per person, which is what "who here actually has MFA" is asked with.

  Every hard delete re-reads the resource first, refuses unless a `confirm`
  argument repeats its live name, and takes `dryRun`; deactivating stays the
  reversible path and the docs say so. Every secret the extension mints — client
  secret, token, key JSON, reset code — is emitted exactly once into a spec
  marked sensitive, so swamp vaults it and it never reaches a log.

  Authentication is a JWT private-key service account: the key is named by the
  definition, as a vault value (`keyJson`) or as a file read at call time
  (`keyJsonFile`), and exchanged per run for a short-lived token. Or a bearer
  token in a file (`accessTokenFile`), sent as it is, so a workflow runs as the
  person whose login wrote it. The system type signs with a System API user's
  key (`systemKeyFile`, `systemUser`), which is the bearer itself. Users speak
  the v2 API, which is the supported surface on Zitadel v4; projects,
  applications, roles and grants speak v1 Management, where v2 is still beta.

  Forked from `@thomas/zitadel` (MIT, copyright Thomas Elliott), which is one
  type and machine identities only, and widened to full CRUD across five types.
repository: "https://github.com/dataverket-org/swamp-extensions"
