id: 39d3cf77-6a01-46b8-9ef3-c7f5d8fa95bd
name: "@dataverket/ko-manifests"
description: >-
  Render Kubernetes manifests with ko: every ko://<import path> image reference in files is built from the Go
  module in dir, pushed to repo, and replaced by its reference pinned by digest. The rendered manifests are
  recorded as the manifests file of the model ko-manifests, for whatever applies them next: kubectl, flux push
  artifact, kustomize; the resolution record lists every image pinned by digest in them, built here or not.
  The run fails unless at least one image was built and, when requirePinned is true (the default), every
  image in the rendered manifests is pinned by digest, third-party images included. Tags,
  platforms, naming, SBOM, base image and cache are inputs as in @dataverket/ko-images. No input carries a
  secret. Its model is created on first use as ko-manifests; runs for different modules share it, so run one
  module at a time.
version: 1
inputs:
  properties:
    dir:
      type: string
      default: .
      description: The Go module's directory, absolute or relative to the repository root
    repo:
      type: string
      description: Registry path the images are pushed under (KO_DOCKER_REPO), or ko.local for the local daemon
    files:
      type: array
      items:
        type: string
      description: Manifests with ko:// references, files or directories, relative to the repository root
    recursive:
      type: boolean
      default: false
      description: Descend into the directories named in files
    selector:
      type: string
      default: ""
      description: Only resources matching this label selector
    tags:
      type: array
      items:
        type: string
      default: [latest]
      description: Tags for every image, such as a commit id and latest
    naming:
      type: string
      enum: [default, preserve-import-paths, base-import-paths, bare]
      default: base-import-paths
      description: How an image is named under repo
    platforms:
      type: array
      items:
        type: string
      default: []
      description: Platforms as os/arch, or all; empty is ko's default, linux/amd64
    sbom:
      type: string
      enum: [spdx, none]
      default: spdx
      description: The SBOM pushed beside each image
    baseImage:
      type: string
      default: ""
      description: Base image for every command, overriding .ko.yaml; pin it by digest
    cache:
      type: string
      default: ""
      description: Directory where ko caches base images, relative to the repository root
    push:
      type: boolean
      default: true
      description: Push the images; false renders with digests that exist nowhere, for a dry run
    requirePinned:
      type: boolean
      default: true
      description: Fail when any image in the rendered manifests, ko-built or not, is not pinned by digest
    insecureRegistry:
      type: boolean
      default: false
      description: Allow a registry served over plain HTTP
  required:
    - repo
    - files
jobs:
  - name: resolve
    steps:
      - name: manifests
        description: ko resolve over the files; the rendered manifests become the manifests file, every pinned image in them the resolution record.
        task:
          type: model_method
          modelType: "@dataverket/ko/module"
          modelName: ko-manifests
          methodName: resolve
          globalArgs:
            dir: ${{ inputs.dir }}
            repo: ${{ inputs.repo }}
            naming: ${{ inputs.naming }}
            platforms: ${{ inputs.platforms }}
            sbom: ${{ inputs.sbom }}
            baseImage: ${{ inputs.baseImage }}
            cache: ${{ inputs.cache }}
            insecureRegistry: ${{ inputs.insecureRegistry }}
          inputs:
            files: ${{ inputs.files }}
            recursive: ${{ inputs.recursive }}
            selector: ${{ inputs.selector }}
            tags: ${{ inputs.tags }}
            push: ${{ inputs.push }}
  - name: verify
    dependsOn:
      - job: resolve
        condition:
          type: succeeded
    steps:
      - name: images-built
        description: At least one ko:// reference was built, and this run wrote the resolution record.
        task:
          type: assert
          expr: >-
            data.latest("ko-manifests", "resolution").tags.?workflowRunId.orValue("") == run.id
            && data.latest("ko-manifests", "resolution").attributes.builtCount >= 1
          message: >-
            ko resolve built no image from ${{ inputs.files }}: no ko:// reference in them, or the run that wrote
            the resolution record is not this one
          severity: high
      - name: every-image-pinned
        description: Every image in the rendered manifests is pinned by digest, unless requirePinned is false.
        task:
          type: assert
          expr: >-
            !inputs.requirePinned || data.latest("ko-manifests", "resolution").attributes.allPinned == true
          message: >-
            Images in the rendered manifests are not pinned by digest: ${{ data.latest("ko-manifests", "resolution").attributes.unpinned }}
          severity: high
