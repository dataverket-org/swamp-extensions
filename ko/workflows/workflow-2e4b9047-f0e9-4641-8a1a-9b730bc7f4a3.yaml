id: 2e4b9047-f0e9-4641-8a1a-9b730bc7f4a3
name: "@dataverket/ko-images"
description: >-
  Build every command of one Go module into container images with ko and push them, or load them into the local
  daemon when repo is ko.local, then fail unless every image this run built was recorded with a digest. First
  records what ko worked with (module path, Go and ko versions, the base image in effect), then builds. The
  module's directory, the registry path, the tags, the commands and the platforms are inputs; the base image can
  be pinned by digest and cached so a repeated build needs the network only to push. Images are named
  <repo>/<command> unless naming says otherwise. No input carries a secret: ko authenticates to the registry
  from the container config of the user running swamp, or ko login. Its model is created on first use as
  ko-images; runs for different modules share it, so run one module at a time.
version: 1
inputs:
  properties:
    dir:
      type: string
      default: .
      description: The Go module's directory, absolute or relative to the repository root
    repo:
      type: string
      description: Registry path the images are pushed under (KO_DOCKER_REPO), or ko.local for the local daemon
    tags:
      type: array
      items:
        type: string
      default: [latest]
      description: Tags for every image, such as a commit id and latest
    importPaths:
      type: array
      items:
        type: string
      default: ["."]
      description: Commands to build, relative to the module (./cmd/api) or as patterns (./cmd/...)
    naming:
      type: string
      enum: [default, preserve-import-paths, base-import-paths, bare]
      default: base-import-paths
      description: How an image is named under repo; bare is repo itself and needs exactly one command
    platforms:
      type: array
      items:
        type: string
      default: []
      description: Platforms as os/arch, or all; empty is ko's default, linux/amd64
    sbom:
      type: string
      enum: [spdx, none]
      default: spdx
      description: The SBOM pushed beside each image
    baseImage:
      type: string
      default: ""
      description: Base image for every command, overriding .ko.yaml; pin it by digest
    cache:
      type: string
      default: ""
      description: Directory where ko caches base images, relative to the repository root
    push:
      type: boolean
      default: true
      description: Push the images; false builds them and records their digests without a registry
    tarball:
      type: string
      default: ""
      description: Also write every image to this tarball, relative to the repository root
    insecureRegistry:
      type: boolean
      default: false
      description: Allow a registry served over plain HTTP
  required:
    - repo
jobs:
  - name: describe
    steps:
      - name: module
        description: What ko works with, as evidence beside the images. Read-only.
        task:
          type: model_method
          modelType: "@dataverket/ko/module"
          modelName: ko-images
          methodName: describe
          globalArgs:
            dir: ${{ inputs.dir }}
            repo: ${{ inputs.repo }}
            naming: ${{ inputs.naming }}
            platforms: ${{ inputs.platforms }}
            sbom: ${{ inputs.sbom }}
            baseImage: ${{ inputs.baseImage }}
            cache: ${{ inputs.cache }}
            insecureRegistry: ${{ inputs.insecureRegistry }}
  - name: build
    dependsOn:
      - job: describe
        condition:
          type: succeeded
    steps:
      - name: images
        description: One ko build per command, each recorded as an image record with its digest, and one build record.
        task:
          type: model_method
          modelType: "@dataverket/ko/module"
          modelName: ko-images
          methodName: build
          globalArgs:
            dir: ${{ inputs.dir }}
            repo: ${{ inputs.repo }}
            naming: ${{ inputs.naming }}
            platforms: ${{ inputs.platforms }}
            sbom: ${{ inputs.sbom }}
            baseImage: ${{ inputs.baseImage }}
            cache: ${{ inputs.cache }}
            insecureRegistry: ${{ inputs.insecureRegistry }}
          inputs:
            importPaths: ${{ inputs.importPaths }}
            tags: ${{ inputs.tags }}
            push: ${{ inputs.push }}
            tarball: ${{ inputs.tarball }}
  - name: verify
    dependsOn:
      - job: build
        condition:
          type: succeeded
    steps:
      - name: every-image-has-a-digest
        description: This run recorded at least one image, as many as the build record counts, every one with a sha256 digest.
        task:
          type: assert
          expr: >-
            data.latest("ko-images", "build").attributes.count >= 1
            && data.findBySpec("ko-images", "image").filter(i, i.tags.?workflowRunId.orValue("") == run.id).size() == data.latest("ko-images", "build").attributes.count
            && data.findBySpec("ko-images", "image").filter(i, i.tags.?workflowRunId.orValue("") == run.id && !i.attributes.digest.matches("^sha256:[0-9a-f]{64}$")).size() == 0
          message: >-
            The build of ${{ inputs.dir }} recorded ${{ data.latest("ko-images", "build").attributes.count }} images but
            not every one of them carries a digest; see the image records of ko-images
          severity: high
