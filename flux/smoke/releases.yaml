# What the smoke run reads: a chart server inside the cluster, three sources,
# three HelmReleases and one Kustomization. cluster.sh applies it and then
# changes two of the releases.
apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: v1
kind: Namespace
metadata:
  name: closed
---
apiVersion: v1
kind: Namespace
metadata:
  name: ks-apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: charts
  namespace: charts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: charts
  template:
    metadata:
      labels:
        app: charts
    spec:
      containers:
        - name: httpd
          image: docker.io/library/busybox:1.37
          command: ["httpd", "-f", "-p", "8080", "-h", "/www"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: www
              mountPath: /www
      volumes:
        - name: www
          configMap:
            name: charts
---
apiVersion: v1
kind: Service
metadata:
  name: charts
  namespace: charts
spec:
  selector:
    app: charts
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: local
  namespace: apps
spec:
  interval: 1h
  url: http://charts.charts.svc.cluster.local
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: podinfo
  namespace: apps
spec:
  interval: 1h
  url: oci://ghcr.io/stefanprodan/charts/podinfo
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 6.9.1
---
# Installed at 6.9.1, then upgraded to 6.9.2: two history entries, both good.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: podinfo
  namespace: apps
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: podinfo
  values:
    replicaCount: 1
---
# Installed at 0.1.0 with its test, then upgraded to 0.2.0 with a pre-upgrade
# hook that fails: a failed entry on top of a deployed one, and hook Jobs.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hooked
  namespace: apps
spec:
  interval: 1h
  chart:
    spec:
      chart: hooked
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: local
  test:
    enable: true
  upgrade:
    remediation:
      retries: 0
---
# A chart version that does not exist: never installed, no history at all.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: noversion
  namespace: apps
spec:
  interval: 1h
  chart:
    spec:
      chart: hooked
      version: 9.9.9
      sourceRef:
        kind: HelmRepository
        name: local
---
# What the Kustomization applies: podinfo's own kustomize directory.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: podinfo
  namespace: apps
spec:
  interval: 1h
  url: https://github.com/stefanprodan/podinfo
  ref:
    tag: 6.9.2
---
# Applied into its own namespace, so it shares nothing with the releases.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: podinfo
  namespace: apps
spec:
  interval: 1h
  path: ./kustomize
  prune: true
  targetNamespace: ks-apps
  sourceRef:
    kind: GitRepository
    name: podinfo
---
# The reader of batch c: may get HelmReleases in apps and nothing else, so the
# Job list is refused there and everything is refused in the namespace closed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: smoke-reader
  namespace: apps
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: smoke-reader
  namespace: apps
rules:
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: smoke-reader
  namespace: apps
subjects:
  - kind: ServiceAccount
    name: smoke-reader
    namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: smoke-reader
