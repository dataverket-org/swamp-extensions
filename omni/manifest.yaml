manifestVersion: 1
name: "@dataverket/omni"
version: "2026.09.19.4"
description: >
  Talos fleet discovery for swamp, via Sidero Omni.

  `@dataverket/omni/inventory` asks Omni for its fleet state and writes a
  typed inventory: one `node` per managed machine (hardware, network, Talos
  version, cluster role, connection and readiness), one `cluster` per
  cluster, and a `summary` roll-up. `talosconfig` mints one cluster's admin
  talosconfig for the service account and stores it, with the cluster's node
  IPs, as one resource: everything `@dataverket/talosctl/node` needs to reach
  the machines through Omni's proxy; every verb spoken to the Talos API lives on that
  model, so a lab cluster on plain talosctl and an Omni fleet share one code
  path.

  Forked from `@mccormick/omni` (MIT). The `volumes` method of 2026.09.19.1
  moved to `@dataverket/talosctl/node`. Read-only against Omni: `omnictl get`
  and `omnictl talosconfig` only, authenticated with an Omni service account
  passed through the environment; the key comes from a vault, is marked
  sensitive, and is redacted from logs and errors.
repository: "https://github.com/dataverket-org/swamp-extensions"
paths:
  base: manifest
models:
  - inventory.ts
workflows: []
vaults: []
datastores: []
reports: []
additionalFiles:
  - README.md
  - LICENSE.md
labels:
  - omni
  - talos
  - kubernetes
  - inventory
  - siderolabs
  - talosconfig
dependencies: []
