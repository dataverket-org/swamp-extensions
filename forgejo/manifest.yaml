manifestVersion: 1
name: "@dataverket/forgejo"
version: "2026.10.05.1"
description: >
  Forgejo operations for swamp that reach past a single repository, as
  extensions to `@thomas/forgejo`.

  Ten modules add what upstream has no method for. `actions` covers Actions
  secrets (repo- or org-scoped, write-only), a runner registration token,
  runner listing, runner pruning and a verify-first repository rename.
  `push_mirror` adds the push side of mirroring — upstream's `mirror_ensure`
  is a pull mirror, Forgejo fetching from elsewhere, while a push mirror makes
  Forgejo push a repository to a remote on every commit and on an interval.
  `pull_mirror` adds `pull_mirror_ensure`, a pull mirror that sends only the
  settings it is given, so the forge's own defaults decide visibility and
  the rest, and an existing mirror is changed only in what is named.
  `topics` adds `repo_topics_ensure`, the labels Forgejo shows on a
  repository, additive unless asked to be exact.
  `pr_assign` assigns a pull request, checking every login against the forge
  first so a typo is an error rather than a silently empty list.
  `repo_delete` deletes a repository, verify-first: one already gone is a
  no-op and one with commits is refused unless asked for explicitly, because
  Forgejo has no undelete. `org_delete` deletes an organization the same way:
  one already gone is a no-op and one that still holds repositories is refused.
  `issues` adds `issue_ensure`, which files several issues in one call unless
  one of the same exact title exists, open or closed, with labels by name, and
  `issue_list`. `labels` adds `label_ensure` and `label_list` for an
  organization's shared labels or one repository's.

  Install alongside `@thomas/forgejo`; the methods land on its model types and
  read its `apiUrl` and token. Two pre-flight checks come with them: a policy
  check that `apiUrl` is the forge's base URL without a trailing `/api/v1`,
  and a live one that the token is still accepted. No secret value is recorded or logged: the
  registration token is marked sensitive, so swamp vaults it and records a
  reference, and a mirror's remote credential is sent to Forgejo once and
  never stored.
repository: "https://github.com/dataverket-org/swamp-extensions"
paths:
  base: manifest
models:
  - actions.ts
  - checks.ts
  - push_mirror.ts
  - pull_mirror.ts
  - topics.ts
  - units.ts
  - pr_assign.ts
  - repo_delete.ts
  - org_delete.ts
  - issues.ts
  - labels.ts
workflows: []
vaults: []
datastores: []
reports: []
additionalFiles:
  - README.md
  - LICENSE.md
labels:
  - forgejo
  - gitea
  - git
  - forge
  - actions
  - runners
  - mirroring
  - topics
  - issues
  - labels
dependencies: []
