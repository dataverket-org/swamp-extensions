manifestVersion: 1
name: "@dataverket/forgejo"
version: "2026.09.29.1"
description: >
  Forgejo operations for swamp that reach past a single repository, as
  extensions to `@thomas/forgejo`.

  Four modules add what upstream has no method for. `actions` covers Actions
  secrets (repo- or org-scoped, write-only), a runner registration token,
  runner listing, runner pruning and a verify-first repository rename.
  `push_mirror` adds the push side of mirroring — upstream's `mirror_ensure`
  is a pull mirror, Forgejo fetching from elsewhere, while a push mirror makes
  Forgejo push a repository to a remote on every commit and on an interval.
  `pr_assign` assigns a pull request, checking every login against the forge
  first so a typo is an error rather than a silently empty list.
  `repo_delete` deletes a repository, verify-first: one already gone is a
  no-op and one with commits is refused unless asked for explicitly, because
  Forgejo has no undelete.

  Install alongside `@thomas/forgejo`; the methods land on its model types and
  read its `apiUrl` and token. No secret value is recorded or logged: the
  registration token is marked sensitive, so swamp vaults it and records a
  reference, and a mirror's remote credential is sent to Forgejo once and
  never stored.
repository: "https://github.com/dataverket-org/swamp-extensions"
paths:
  base: manifest
models:
  - actions.ts
  - push_mirror.ts
  - pr_assign.ts
  - repo_delete.ts
workflows: []
vaults: []
datastores: []
reports: []
additionalFiles:
  - README.md
  - LICENSE.md
labels:
  - forgejo
  - gitea
  - git
  - forge
  - actions
  - runners
  - mirroring
dependencies: []
