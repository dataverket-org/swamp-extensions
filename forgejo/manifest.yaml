manifestVersion: 1
name: "@dataverket/forgejo"
version: "2026.11.12.1"
description: >
  Forgejo (or Gitea) administration for swamp over the /api/v1 REST API with
  a scoped access token, in the model type `@dataverket/forgejo`, and the
  issues of one repository as a stagecraft tracker,
  `@dataverket/forgejo/stagecraft-tracker`.

  A fork of `@thomas/forgejo` 2026.09.04.2 (MIT, copyright Thomas Elliott)
  merged with the methods dataverket had published as add-ons to it. The
  upstream base is kept: find-or-create organizations and repositories and
  converge their settings, collaborators and branch protection, pull mirrors
  from GitHub with a fleet-wide sync audit, pull requests opened, inspected
  with mergeability and CI state, and merged behind a guard, and webhooks
  audited or repointed without ever touching their secret. The base's own
  reachable check is dropped in favour of this package's two, and a check
  without the schema's defaults no longer aborts its request at once.

  The former add-ons, now part of the same type: Actions secrets (repo- or
  org-scoped, write-only), a runner registration token, runner listing and
  pruning, a verify-first repository rename, push mirrors (ensure, list,
  delete, sync now), a pull mirror that sends only the settings it is given,
  repository topics and units, a repository's pull-request merge settings
  (the merge styles offered, the default, update by rebase) read and
  converged with only the given settings sent, pull-request assignment
  with every login checked first, issues filed by title with labels by name, labels of an
  organization or a repository, and verify-first deletes of a repository and
  of an organization: one already gone is a no-op, one with commits or with
  repositories is refused unless asked for explicitly, because Forgejo has no
  undelete.

  For software factories: a pull request's discussion read back (comments,
  reviews with their state, inline review comments) and a comment posted on
  it, a pull request's merge commit, time and merger, issues opened or
  closed with a comment saying why and an issue's text rewritten (a pull
  request's number refused before anything is written), a tag protection
  rule whose whitelists are converged as exact sets, and a
  `@swamp/software-factory` work item mirrored one way into a Forgejo issue
  that is rewritten from the factory's records, commented on when the stage
  changes or a blocking finding appears, and closed when the work item ends.

  The second type is a tracker for `@swamp/stagecraft`, contract version 1,
  behind stagecraft's publisher: `describe`, `operate` with the six
  operations every tracker offers, and `labels`, which reports its label
  scheme; the shipped workflow `@dataverket/forgejo-stagecraft-labels`
  writes that scheme with the first type's `label_ensure`. A ticket is an issue;
  its status and type are exclusive scoped labels (`status/new`,
  `type/bug`), and the issue's state follows the status. `blocked_by` is the
  forge's own issue dependency; parent, related and duplicate relations are
  kept in a block the tracker owns at the end of both issues' bodies, and the
  tracker enforces the contract's relation rules itself. It shares the forge
  client and the label code with the first type, which knows nothing of
  stagecraft.

  Two pre-flight checks: a policy check that `apiUrl` is the forge's base URL
  without a trailing `/api/v1`, and a live one that the token is still
  accepted. No secret value is recorded or logged: the registration token is
  marked sensitive, so swamp vaults it and records a reference; a mirror's
  source or remote credential is sent to Forgejo once and never stored; and a
  token the forge echoes back in an error is masked before it becomes data.
  No redirect is followed: a renamed repository's old name is refused with
  the new name, never read, patched or deleted in its place.

  Records are stored under portable data names, `repo-<owner>-<repo>`,
  `pull-<owner>-<repo>-<index>`, `push-mirror-<owner>-<repo>-<remote>`
  and so on, so they hold on Windows too; before 2026.11.09.1 the names used
  `:`, which Windows refuses. Data under an old name is left where it is; the
  README says how to remove it.
