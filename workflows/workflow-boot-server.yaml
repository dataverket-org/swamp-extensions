id: d58e9ace-cb90-43ef-bc41-932018aefb26
name: "@dataverket/openstack/boot-server"
description: >-
  One server the way the OpenTofu provider would lay it out: a port on the private network (with a fixed address
  when given), the server booted from an image on that port with a config drive, and, unless publicIp is false, a
  floating IP allocated from the external network and bound to the port. The port is <name>-eth0. Every step is a
  find-or-create, so re-running converges an interrupted boot.
version: 1
inputs:
  properties:
    serverModel:
      type: string
      description: Name of the @dataverket/openstack/server model instance
    portModel:
      type: string
      description: Name of the @dataverket/openstack/port model instance
    floatingIpModel:
      type: string
      description: Name of the @dataverket/openstack/floating-ip model instance
    name:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]*$"
      description: Server name; its port is <name>-eth0
    network:
      type: string
      description: Private network (name or ID) the port is created on
    subnet:
      type: string
      default: ""
      description: Subnet (name or ID) of the fixed address; empty lets Neutron choose
    fixedIp:
      type: string
      default: ""
      description: Fixed address for the port; empty lets Neutron allocate one
    flavor:
      type: string
      description: Flavor name or ID
    image:
      type: string
      description: Boot image name or ID
    keyName:
      type: string
      default: ""
      description: Keypair to inject; empty for none
    securityGroups:
      type: array
      items:
        type: string
      default:
        - default
      description: Security groups on the port
    userData:
      type: string
      default: ""
      description: cloud-init user data; empty for none
    configDrive:
      type: boolean
      default: true
    externalNetwork:
      type: string
      default: ext-net
      description: External network the floating IP is allocated from
    publicIp:
      type: boolean
      default: true
      description: Allocate and bind a floating IP
  required:
    - serverModel
    - portModel
    - floatingIpModel
    - name
    - network
    - flavor
    - image
jobs:
  - name: server
    steps:
      - name: port
        description: The server's port, so its address is decided before the server exists.
        task:
          type: model_method
          modelIdOrName: ${{ inputs.portModel }}
          methodName: create
          inputs:
            name: ${{ inputs.name + "-eth0" }}
            network: ${{ inputs.network }}
            fixedIps: '${{ inputs.fixedIp != "" ? [{"subnet": inputs.subnet, "ipAddress": inputs.fixedIp}] : [] }}'
            securityGroups: ${{ inputs.securityGroups }}
      - name: server
        description: The server on that port; waits until ACTIVE.
        dependsOn:
          - step: port
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: ${{ inputs.serverModel }}
          methodName: create
          inputs:
            name: ${{ inputs.name }}
            flavor: ${{ inputs.flavor }}
            image: ${{ inputs.image }}
            ports:
              - ${{ inputs.name + "-eth0" }}
            keyName: ${{ inputs.keyName }}
            userData: ${{ inputs.userData }}
            configDrive: ${{ inputs.configDrive }}
            wait: true
  - name: public-ip
    dependsOn:
      - job: server
        condition:
          type: succeeded
    steps:
      - name: allocate
        description: A floating IP described with the server name, reused on re-run.
        guard: ${{ !inputs.publicIp }}
        task:
          type: model_method
          modelIdOrName: ${{ inputs.floatingIpModel }}
          methodName: allocate
          inputs:
            network: ${{ inputs.externalNetwork }}
            description: ${{ inputs.name }}
      - name: bind
        description: The floating IP on the server's port.
        guard: ${{ !inputs.publicIp }}
        dependsOn:
          - step: allocate
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: ${{ inputs.floatingIpModel }}
          methodName: bind
          inputs:
            floatingIp: '${{ data.findBySpec(inputs.floatingIpModel, "floatingIp").filter(f, f.attributes.description == inputs.name)[0].attributes.address }}'
            port: ${{ inputs.name + "-eth0" }}
  - name: verify
    dependsOn:
      - job: public-ip
        condition:
          type: succeeded
    steps:
      - name: server-active
        task:
          type: assert
          expr: >-
            data.latest(inputs.serverModel, "server-" + inputs.name).attributes.status == "ACTIVE"
          message: "The server is not ACTIVE"
          severity: high
      - name: public-ip-bound
        guard: ${{ !inputs.publicIp }}
        task:
          type: assert
          expr: >-
            data.findBySpec(inputs.floatingIpModel, "floatingIp").exists(f,
              f.attributes.description == inputs.name && f.attributes.portId != "")
          message: "No floating IP is bound to the server's port"
          severity: high
