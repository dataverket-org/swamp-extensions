id: 32b61a69-3c7c-412d-8b90-5992eb8e1146
name: "@dataverket/openstack/rotate-application-credential"
description: >-
  Rotate an application credential in two halves with a human in between: create the new credential (its secret
  lands in the vault through the model's sensitive secret record), verify it is recorded, then wait for approval
  before deleting the old one, since every consumer must first be switched to the new secret. Keystone only lets a
  password-authenticated user or an unrestricted credential create and delete application credentials, so the
  model instance must authenticate that way. Nothing is deleted when oldName is empty.
version: 1
inputs:
  properties:
    credentialModel:
      type: string
      description: Name of the @dataverket/openstack/application-credential model instance (password or unrestricted auth)
    newName:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]*$"
      description: Name of the credential to create
    oldName:
      type: string
      default: ""
      description: Credential to delete after approval; empty to only create
    roles:
      type: array
      items:
        type: string
      default: []
      description: Roles to grant; empty grants every role the user holds on the project
    description:
      type: string
      default: ""
    expiration:
      type: string
      default: ""
      description: ISO-8601 expiry, e.g. 2027-01-01T00:00:00; empty never expires
  required:
    - credentialModel
    - newName
jobs:
  - name: create
    steps:
      - name: create
        description: The new credential; an existing one of the same name is reused, but then no secret is recorded.
        task:
          type: model_method
          modelIdOrName: ${{ inputs.credentialModel }}
          methodName: create
          inputs:
            name: ${{ inputs.newName }}
            roles: ${{ inputs.roles }}
            description: ${{ inputs.description }}
            expiration: ${{ inputs.expiration }}
            unrestricted: false
      - name: recorded
        dependsOn:
          - step: create
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.latest(inputs.credentialModel, "appcred-" + inputs.newName).attributes.id != ""
          message: "The new credential is not recorded"
          severity: high
      - name: secret-recorded
        dependsOn:
          - step: create
            condition:
              type: succeeded
        task:
          type: assert
          expr: >-
            data.latest(inputs.credentialModel, "secret-" + inputs.newName).attributes.id != ""
          message: "No secret was recorded for the new credential; it already existed, so its secret cannot be recovered"
          severity: high
  - name: retire
    dependsOn:
      - job: create
        condition:
          type: succeeded
    steps:
      - name: consumers-switched
        description: Approve once every consumer authenticates with the new secret.
        guard: ${{ inputs.oldName == "" }}
        task:
          type: manual_approval
          prompt: "Every consumer switched to the new secret? Approving deletes the old credential."
      - name: delete-old
        guard: ${{ inputs.oldName == "" }}
        dependsOn:
          - step: consumers-switched
            condition:
              type: succeeded
        task:
          type: model_method
          modelIdOrName: ${{ inputs.credentialModel }}
          methodName: delete
          inputs:
            applicationCredential: ${{ inputs.oldName }}
