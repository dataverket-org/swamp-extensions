manifestVersion: 1
name: "@dataverket/platform-health"
version: "2026.10.28.1"
description: >
  One workflow, `@dataverket/platform-health`, that checks the forges and S3
  gateways a repository names and fails when one of them is down.

  Each run calls the read-only `health` method of every `@dataverket/forgejo`
  model in `forgeModels` and of every `@dataverket/versitygw/gateway` model in
  `gatewayModels`, which records each one's version and health, or
  reachability, TLS and latency, as that model's own record. One assertion per
  model then fails the run when a forge answers unhealthy or a gateway is
  unreachable, or slower than `maxLatencyMs` when that is set. Nothing is
  written to any service.

  The models are the caller's, named by name, so URLs, tokens and CA files stay
  in the caller's definitions and no input ever carries a value. A run takes a
  few seconds and is made to be run often: by hand as the morning check, on a
  schedule under `swamp serve`, or as the first step of a larger workflow.
  Built on `@dataverket/forgejo` and `@dataverket/versitygw`, both
  dependencies.
repository: "https://github.com/dataverket-org/swamp-extensions"
license: "AGPL-3.0-only"
paths:
  base: manifest
models: []
workflows:
  - workflow-a360195c-7a3a-45ad-9cdf-473fbf6be70c.yaml
vaults: []
datastores: []
reports: []
additionalFiles:
  - README.md
  - LICENSE.md
labels:
